name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      # The encoder's files are pinned in encoder/config.json, so its hash keys the cache.
      - uses: actions/cache@v6
        with:
          path: data/models
          key: models-${{ hashFiles('encoder/config.json') }}
      - run: uv run test.py
      - run: uv run model.py
